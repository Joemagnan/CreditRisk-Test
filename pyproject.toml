[project]
name = "creditrisk-test"
version = "1.0.0"
description = "Assurance qualité et tests d'un système de prédiction du risque de crédit"
requires-python = ">=3.12"
authors = [{ name = "Meweani MAGNAN" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
